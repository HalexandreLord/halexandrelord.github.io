<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ingressos QR Code</title>
  <!-- Bibliotecas externas para QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    h1, h2 { text-align: center; color: #1e293b; }

    /* Navegação por Abas */
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 12px 24px; font-weight: bold; border: none; background: #e2e8f0; cursor: pointer; border-radius: 8px; font-size: 1rem; }
    .tab-btn.active { background: #2563eb; color: white; }

    .content-section { display: none; max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .content-section.active { display: block; }

    /* Formulários e Botões */
    .form-group { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
    input[type="number"], input[type="text"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; width: 200px; }
    button.action-btn { padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    button.action-btn:hover { background: #15803d; }

    /* Grid de Ingressos / Etiquetas */
    .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .ticket-card { border: 2px dashed #94a3b8; padding: 15px; text-align: center; border-radius: 8px; background: #fff; }
    .ticket-card h3 { margin: 5px 0; font-size: 1.1rem; }
    .ticket-card .qr-container { display: flex; justify-content: center; margin: 10px 0; }

    /* Scanner */
    #reader-container { width: 100%; max-width: 450px; margin: 0 auto; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; min-height: 250px; }
    .result-box { margin-top: 20px; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; display: none; }
    .status-valid { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-used { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-invalid { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }

    /* Tabela de Ingressos */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; }
    th { background: #f1f5f9; }

    /* Estilos de Impressão */
    @media print {
      body { background: white; padding: 0; }
      .tabs, .form-group, h1, .no-print { display: none !important; }
      .content-section { box-shadow: none; padding: 0; }
      .tickets-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .ticket-card { page-break-inside: avoid; border: 1px solid #000; }
    }
  </style>
</head>
<body>

  <h1>Validador & Gerador de Ingressos</h1>

  <div class="tabs no-print">
    <button class="tab-btn active" onclick="switchTab('generator', event)">1. Gerar Ingressos</button>
    <button class="tab-btn" onclick="switchTab('scanner', event)">2. Validar / Ler QR Code</button>
    <button class="tab-btn" onclick="switchTab('dashboard', event)">3. Relatório de Vendas/Uso</button>
  </div>

  <!-- ABA 1: GERADOR -->
  <div id="generator" class="content-section active">
    <h2>Gerar Novas Etiquetas</h2>
    <div class="form-group no-print">
      <label for="ticketCount">Quantidade de Ingressos:</label>
      <input type="number" id="ticketCount" min="1" max="100" value="5">
      <button class="action-btn" onclick="generateTickets()">Gerar e Salvar</button>
      <button class="action-btn" style="background: #475569;" onclick="window.print()">Imprimir Etiquetas</button>
    </div>

    <div id="ticketsContainer" class="tickets-grid"></div>
  </div>

  <!-- ABA 2: LEITOR/VALIDADOR -->
  <div id="scanner" class="content-section">
    <h2>Leitura de Ingresso</h2>
    
    <div id="reader-container">
      <div id="reader"></div>
      <div class="form-group" style="margin-top: 10px;">
        <button id="camToggleBtn" class="action-btn" style="background: #0284c7;" onclick="toggleCamera()">Ligar Câmera</button>
      </div>
    </div>

    <div class="form-group" style="margin-top: 25px;">
      <input type="text" id="manualCode" placeholder="Digitar código manual...">
      <button class="action-btn" onclick="validateCode(document.getElementById('manualCode').value)">Validar Manual</button>
    </div>

    <div id="resultBox" class="result-box"></div>
  </div>

  <!-- ABA 3: DASHBOARD -->
  <div id="dashboard" class="content-section">
    <h2>Histórico de Ingressos</h2>
    <button class="action-btn" style="background: #dc2626; margin-bottom: 15px;" onclick="resetSystem()">Limpar Todo o Banco de Dados</button>
    
    <table>
      <thead>
        <tr>
          <th>Código/ID</th>
          <th>Status</th>
          <th>Data de Entrada</th>
        </tr>
      </thead>
      <tbody id="ticketsTableBody"></tbody>
    </table>
  </div>

  <script>
    // --- ESTADO DO SISTEMA (localStorage) ---
    let db = JSON.parse(localStorage.getItem('ticketSystemDB')) || {
      lastId: 1000,
      tickets: {}
    };

    function saveDB() {
      localStorage.setItem('ticketSystemDB', JSON.stringify(db));
    }

    // --- GERENCIADOR DA CÂMERA ---
    let html5QrCode = null;
    let isCameraActive = false;

    async function toggleCamera() {
      const btn = document.getElementById('camToggleBtn');

      if (isCameraActive) {
        await stopCamera();
        btn.innerText = "Ligar Câmera";
        btn.style.background = "#0284c7";
      } else {
        startCamera();
      }
    }

    function startCamera() {
      const btn = document.getElementById('camToggleBtn');
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      // Tenta usar a câmera traseira ("environment"), se falhar aceita qualquer câmera ("user"/webcam)
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          validateCode(decodedText);
        },
        (errorMessage) => { /* Ignora falhas contínuas de leitura sem QR Code na tela */ }
      ).then(() => {
        isCameraActive = true;
        btn.innerText = "Desligar Câmera";
        btn.style.background = "#dc2626";
      }).catch(err => {
        console.warn("Câmera traseira falhou, tentando modo fallback...", err);
        // Fallback: tenta qualquer câmera disponível
        html5QrCode.start(
          { facingMode: "user" },
          config,
          (decodedText) => validateCode(decodedText)
        ).then(() => {
          isCameraActive = true;
          btn.innerText = "Desligar Câmera";
          btn.style.background = "#dc2626";
        }).catch(err2 => {
          alert("Erro ao acessar a câmera. Certifique-se de dar permissão e estar em uma conexão HTTPS.");
          console.error(err2);
        });
      });
    }

    async function stopCamera() {
      if (html5QrCode && isCameraActive) {
        try {
          await html5QrCode.stop();
          isCameraActive = false;
        } catch (err) {
          console.error("Erro ao desligar câmera:", err);
        }
      }
    }

    // --- TROCA DE ABAS ---
    function switchTab(tabId, event) {
      document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (event && event.target) {
        event.target.classList.add('active');
      }

      // Se sair da aba scanner, desliga a câmera automaticamente
      if (tabId !== 'scanner') {
        stopCamera();
        const btn = document.getElementById('camToggleBtn');
        btn.innerText = "Ligar Câmera";
        btn.style.background = "#0284c7";
      }

      if (tabId === 'dashboard') {
        renderDashboard();
      }
    }

    // --- GERADOR DE INGRESSOS ---
    function generateTickets() {
      const count = parseInt(document.getElementById('ticketCount').value);
      if (isNaN(count) || count < 1) return alert('Insira uma quantidade válida.');

      const container = document.getElementById('ticketsContainer');
      container.innerHTML = '';

      for (let i = 0; i < count; i++) {
        db.lastId++;
        const ticketCode = `ING-${db.lastId}`;

        db.tickets[ticketCode] = {
          status: 'VALID',
          usedAt: null
        };

        createTicketCard(ticketCode, container);
      }

      saveDB();
    }

    function createTicketCard(code, container) {
      const card = document.createElement('div');
      card.className = 'ticket-card';
      
      const title = document.createElement('h3');
      title.innerText = 'INGRESSO EVENTO';

      const codeText = document.createElement('p');
      codeText.innerHTML = `<strong>Cód:</strong> ${code}`;

      const qrDiv = document.createElement('div');
      qrDiv.className = 'qr-container';

      card.appendChild(title);
      card.appendChild(qrDiv);
      card.appendChild(codeText);
      container.appendChild(card);

      new QRCode(qrDiv, {
        text: code,
        width: 120,
        height: 120
      });
    }

    // --- LEITURA E VALIDAÇÃO ---
    function validateCode(code) {
      const cleanCode = code.trim().toUpperCase();
      const resultBox = document.getElementById('resultBox');
      resultBox.style.display = 'block';

      if (!cleanCode) return;

      if (!db.tickets[cleanCode]) {
        resultBox.className = 'result-box status-invalid';
        resultBox.innerHTML = `❌ INGRESSO INVÁLIDO!<br><small>Código (${cleanCode}) não encontrado.</small>`;
      } else if (db.tickets[cleanCode].status === 'USED') {
        resultBox.className = 'result-box status-used';
        resultBox.innerHTML = `⚠️ ENTRADA NEGADA!<br>Lido anteriormente em: ${db.tickets[cleanCode].usedAt}`;
      } else if (db.tickets[cleanCode].status === 'VALID') {
        const now = new Date().toLocaleString('pt-BR');
        db.tickets[cleanCode].status = 'USED';
        db.tickets[cleanCode].usedAt = now;
        saveDB();

        resultBox.className = 'result-box status-valid';
        resultBox.innerHTML = `✅ ENTRADA LIBERADA!<br><small>Código: ${cleanCode}</small>`;
      }

      document.getElementById('manualCode').value = '';
    }

    // --- DASHBOARD ---
    function renderDashboard() {
      const tbody = document.getElementById('ticketsTableBody');
      tbody.innerHTML = '';

      const keys = Object.keys(db.tickets);
      if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3">Nenhum ingresso gerado ainda.</td></tr>';
        return;
      }

      keys.forEach(code => {
        const item = db.tickets[code];
        const row = document.createElement('tr');

        const statusBadge = item.status === 'VALID' 
          ? '<span style="color: green; font-weight: bold;">Disponível</span>' 
          : '<span style="color: red; font-weight: bold;">USADO</span>';

        row.innerHTML = `
          <td>${code}</td>
          <td>${statusBadge}</td>
          <td>${item.usedAt || '-'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetSystem() {
      if (confirm("Tem certeza que deseja apagar TODOS os ingressos e zerar o sistema?")) {
        localStorage.removeItem('ticketSystemDB');
        db = { lastId: 1000, tickets: {} };
        document.getElementById('ticketsContainer').innerHTML = '';
        renderDashboard();
        alert("Sistema reiniciado.");
      }
    }
  </script>
</body>
</html>
